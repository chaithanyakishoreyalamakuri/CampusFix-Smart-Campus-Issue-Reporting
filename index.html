<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusFix</title><link rel="stylesheet" href="style.css"></head><body><header><b>🛠 CampusFix</b><label>View as <select id="role"><option value="student">Student</option><option value="admin">Admin</option><option value="staff">Maintenance staff</option></select></label></header><main><h1 id="heading">Student portal</h1><p id="sub">Report a campus issue and track its progress.</p><section id="student"><form id="form"><h2>Report an issue</h2><input id="name" placeholder="Your name" value="Campus Student" required><input id="title" placeholder="Issue title (e.g. Fan not working)" required><select id="category"><option>Electrical</option><option>Cleanliness</option><option>Classroom</option><option>Network / Wi-Fi</option><option>Water / Plumbing</option><option>Other</option></select><input id="location" placeholder="Location (e.g. Block A, Room 204)" required><textarea id="desc" placeholder="Describe the issue" required></textarea><button>Submit report</button></form><section class="panel"><h2>My reports</h2><div id="studentList"></div></section></section><section id="admin" hidden><section class="panel"><h2>All reported issues</h2><p>Assign a staff member. Verify work after maintenance marks it completed.</p><div id="adminList"></div></section></section><section id="staff" hidden><section class="panel"><h2>Assigned maintenance jobs</h2><div id="staffList"></div></section></section></main><script src="script.js"></script></body></html>
